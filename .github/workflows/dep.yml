name: deployment example second workflow 
on:
  push:
    branches:
      - 'main'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: downloading code from second-action-react-demo repo
        uses: actions/checkout@v3
        #with:
        #  repository: second-action-react-demo
        #  token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test   